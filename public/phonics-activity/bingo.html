<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>윌그로우 파닉스 빙고 — 학생용 인쇄</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=IBM+Plex+Mono:wght@500;600&display=swap');
*{box-sizing:border-box; margin:0; padding:0; font-family:'Space Grotesk','Apple SD Gothic Neo','Malgun Gothic',sans-serif;}
body{background:#f4f4f4; color:#111;}
.mono{font-family:'IBM Plex Mono',ui-monospace,monospace;}

/* ===== screen-only toolbar ===== */
#toolbar{display:flex; gap:12px; align-items:center; justify-content:center; padding:16px; background:#f4f4f4; border-bottom:2.5px solid #111; flex-wrap:wrap; position:sticky; top:0;}
#toolbar .lbl{font-family:'IBM Plex Mono',monospace; font-size:.8rem; font-weight:600; letter-spacing:.08em;}
.optBtn{padding:10px 20px; border-radius:99px; font-size:.95rem; font-weight:700; background:#fff; border:2.5px solid #111; box-shadow:3px 3px 0 #111; cursor:pointer; font-family:inherit;}
.optBtn.sel{background:#111; color:#fff;}
.optBtn:hover{transform:translate(-1px,-1px); box-shadow:4px 4px 0 #111;}
.printBtn{background:#111; color:#fff;}

/* ===== card sheet ===== */
#sheet{max-width:800px; margin:24px auto; padding:0 16px;}
.card{background:#fff; border:3px solid #111; border-radius:18px; padding:22px 26px 26px; margin-bottom:26px; box-shadow:6px 6px 0 #111; page-break-inside:avoid;}
.cardHead{display:flex; align-items:center; gap:14px; margin-bottom:14px;}
.cardHead img{width:46px; height:46px; object-fit:contain; filter:grayscale(1); border:2.5px solid #111; border-radius:10px; background:#fff; padding:4px;}
.cardHead .t1{font-size:1.35rem; font-weight:700; letter-spacing:-.02em;}
.cardHead .t1 .star{color:#111;}
.cardHead .t2{font-family:'IBM Plex Mono',monospace; font-size:.68rem; font-weight:600; letter-spacing:.14em; color:#555;}
.nameRow{margin-left:auto; text-align:right; font-size:.95rem; font-weight:700;}
.nameRow .line{display:inline-block; width:150px; border-bottom:2px solid #111; margin-left:6px;}
.grid{display:grid; gap:0; border:3px solid #111; border-radius:12px; overflow:hidden;}
.grid.g3{grid-template-columns:repeat(3,1fr);}
.grid.g4{grid-template-columns:repeat(4,1fr);}
.grid.g5{grid-template-columns:repeat(5,1fr);}
.cell{border:1.5px solid #111; background:#fff;}
.g3 .cell{height:88px;}
.g4 .cell{height:64px;}
.hint{font-family:'IBM Plex Mono',monospace; font-size:.7rem; font-weight:600; color:#777; margin-top:10px; letter-spacing:.05em;}
.hint b{color:#111;}

/* ===== print ===== */
@media print{
  body{background:#fff;}
  #toolbar{display:none;}
  #sheet{max-width:100%; margin:0; padding:0;}
  .card{box-shadow:none; margin-bottom:18px;}
  @page{size:A4 portrait; margin:12mm;}
}
</style>
</head>
<body>

<div id="toolbar">
  <span class="lbl">칸 크기:</span>
  <button class="optBtn sel" id="b3" onclick="setSize(3)">3×3</button>
  <button class="optBtn" id="b4" onclick="setSize(4)">4×4</button>
  <button class="optBtn" id="b5" onclick="setSize(5)">5×5</button>
  <span class="lbl">장수:</span>
  <button class="optBtn sel" id="c2" onclick="setCount(2)">한 페이지 2장</button>
  <button class="optBtn" id="c1" onclick="setCount(1)">한 페이지 1장</button>
  <button class="optBtn printBtn" onclick="window.print()">🖨 인쇄하기</button>
</div>

<div id="sheet"></div>

let size=3, count=2;
function setSize(n){ size=n; document.getElementById("b3").classList.toggle("sel",n===3); document.getElementById("b4").classList.toggle("sel",n===4); document.getElementById("b5").classList.toggle("sel",n===5); render(); }
function setCount(n){ count=n; document.getElementById("c2").classList.toggle("sel",n===2); document.getElementById("c1").classList.toggle("sel",n===1); render(); }
function render(){
  const cells = Array.from({length:size*size},()=>'<div class="cell"></div>').join("");
  const card = `
    <div class="card">
      <div class="cardHead">
        <img src="${LOGO}" alt="윌그로우어학원 로고">
        <div>
          <div class="t1">willgrow<span class="star">*</span>phonics BINGO</div>
          <div class="t2">WILLGROW ENGLISH · ACTIVITY DAY</div>
        </div>
        <div class="nameRow">이름<span class="line"></span></div>
      </div>
      <div class="grid g${size}">${cells}</div>
      <div class="hint">HOW TO PLAY — ① 화면의 단어 뱅크에서 골라 한 칸에 한 단어씩 적어요 ✏️ ② 화면에 나온 단어를 지워요 ③ 가로·세로·대각선 한 줄이면 <b>"BINGO!"</b> 🎉</div>
    </div>`;
  document.getElementById("sheet").innerHTML = card.repeat(count);
}
render();
</script>
