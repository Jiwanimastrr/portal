# Phonics Activity Day 운영 계획

초등 저학년 대상, 주 1회, 교사가 화면(프로젝터/TV)에 게임을 띄워 전체 학급이 함께 복습하는 방식. Phonics Monster 1~4 자료 기반.

---

## 1. 리서치 요약 — 전문가·연구 견해

### 근거가 확실한 것

**게임 기반 파닉스 복습은 효과가 있다.** 인도 1~2학년 EFL 학습자 대상 무작위 대조 실험(RCT)에서 게임 기반 파닉스 개입이 유의미한 읽기 향상을 보였고(Patel 2022, Journal of Computer Assisted Learning), 디지털 게임 기반 파닉스가 난독 위험군 아동의 문자 지식도 향상시켰다(Frontiers in Psychology 2021). 게임 기반 리터러시 프로그램을 쓴 유치원생이 표준화 시험에서 비교 집단을 앞섰다는 결과도 있다(SAGE 2025).

**복습의 핵심 기제는 '인출 연습(retrieval practice)'이다.** 낮은 부담의 퀴즈형 인출 연습이 초등 포함 거의 모든 학령에서 장기 기억을 크게 높이고(호주 AERO 실천 가이드), 반복 인출을 시간 간격을 두고(spaced) 하면 효과가 더 커진다. Agarwal 등(2014)은 교실 인출 연습이 시험 불안을 오히려 줄인다는 것도 보였다. → 게임은 '보여주기'가 아니라 아이들이 소리·단어를 **스스로 꺼내어 말하게** 만들어야 한다.

**저학년 집중 시간은 짧다.** 7~9세 집중 지속 시간은 대략 15~25분. 교육 실무 자료들은 한 활동을 짧게 끊고 움직임(brain break)을 섞으라고 일관되게 권고한다. → 한 게임 5~8분, 3~4개 로테이션이 적정.

### 상충되는 의견과 나의 판단

| 쟁점 | 한쪽 견해 | 반대 견해 | 판단 (이 학원 상황 기준) |
|---|---|---|---|
| 게임 vs 명시적 지도 | Science of Reading 진영: 파닉스는 체계적·명시적 지도가 핵심, 게임은 시간 낭비가 될 수 있음. 과도한 게임화는 오히려 주의를 분산(JITE 2024) | 게임 연구 진영: 참여도·정서가 학습을 견인, RCT에서 효과 입증 | **둘 다 맞다.** 게임은 '새 개념 도입'이 아니라 **이미 배운 유닛의 복습 전용**으로만 사용. 게임 요소(캐릭터, 애니메이션)는 최소화하고 화면의 90%가 글자·단어가 되게 함 |
| 전체 학급 vs 소그룹 | 연구상 전체 학급 수업에서 off-task(딴짓)가 소그룹보다 많음 | 전체 학급 게임은 관리가 쉽고 에너지·소속감이 큼(British Council) | 화면 1개 환경이므로 전체 학급으로 하되, **전원 응답 체계**(다 같이 소리 내어 읽기, 팀별 순환 지목)로 딴짓을 구조적으로 차단 |
| 경쟁 vs 협력 | 경쟁은 흥미를 높이지만 지는 팀의 저학년 아이들이 위축될 수 있음 | British Council: 경쟁 게임을 협력형으로 변형 가능 — 팀 합산 점수가 공동 목표를 넘으면 전체 보상 | **가벼운 팀 경쟁 + 공동 목표 병행.** 개인 탈락전은 금지, 점수 리셋이 잦은 짧은 라운드로 패배감 최소화 |
| 디지털 vs 실물 활동 | 화면 게임은 준비가 쉽고 일관적 | 저학년은 몸을 움직여야 함 | 화면 게임 사이에 몸으로 하는 반응(일어서기, 손들기, 판에 치기)을 끼워 넣는 하이브리드 |

---

## 2. 실행 계획 — 어학원 파닉스 커리큘럼 디렉터라면

### 원칙 5가지

1. **복습 전용**: 게임에 나오는 소리·단어는 반드시 그 반이 이미 배운 유닛에서만. (게임 허브에서 책/유닛을 선택하는 이유)
2. **인출 중심**: 모든 게임은 아이가 읽거나·말하거나·고르게 함. 교사가 읽어주고 아이가 듣기만 하는 화면은 없음.
3. **짧은 로테이션**: 게임당 5~8분 × 3~4개. 늘어지기 전에 끊는다.
4. **전원 참여**: "다 같이 읽고 → 팀 대표가 답"의 2단 구조. 대표는 매 문제 순환.
5. **저부담**: 점수는 라운드마다 가볍게, 벌칙 없음, 공동 목표 보너스(예: 두 팀 합계 20점이면 스티커).

### Activity Day 40~45분 표준 진행안

| 시간 | 활동 | 게임 허브 메뉴 |
|---|---|---|
| 5분 | 워밍업: 이번 주 배운 소리 다 같이 읽기 | ⚡ Flash Read (전체 낭독) |
| 8분 | 게임 1: 사라진 글자 맞히기 (팀전) | 🔤 Missing Letter |
| 8분 | 게임 2: 소리가 다른 단어 찾기 | 🕵️ Odd One Out |
| 5분 | 몸 풀기: 단어 듣고 해당 팀 일어서기 (화면 밖 활동) | — |
| 8분 | 게임 3: 짝 맞추기 기억 게임 (협력) | 🧠 Memory Match |
| 8분 | 게임 4: 폭탄 피하기 점수 게임 (하이라이트) | 💣 Word Bomb |
| 3분 | 마무리: 오늘 틀린 단어만 다시 낭독 | ⚡ Flash Read |

- 지난주/지지난주 유닛도 1~2개 섞어 선택 → 간격 반복(spaced review) 자동 구현.
- 자주 틀리는 단어는 다음 주에 또 포함 (게임 허브에서 유닛 중복 선택 가능).

### 반별 적용

- Level 1 진행 반: 글자 소리 + 그림 단어 (A~Z)
- Level 2 진행 반: 단모음 CVC 단어
- Level 3 진행 반: 장모음, Magic e (Unit 9의 짝단어는 Missing Letter에 특히 좋음)
- Level 4 진행 반: 이중자음, 이중글자 — Odd One Out이 소리 구분 훈련에 최적

### 성과 확인 (부담 없이)

Word Bomb 마지막 라운드 정답률을 교사가 눈으로만 체크 → 60% 미만 유닛은 다음 주 다시 편성. 별도 시험 없음(저부담 원칙).
