<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Willgrow Time Timer</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap');

    :root {
      --primary-color: #ff3b30;
      --primary-gradient: conic-gradient(from 0deg, #ff2a5f, #ff7a00, #ff2a5f);
      --glass-bg: rgba(255, 255, 255, 0.05);
      --glass-border: rgba(255, 255, 255, 0.08);
      --text-color: #ffffff;
      --disk-bg: rgba(255, 255, 255, 0.03);
      --modal-bg: rgba(18, 18, 24, 0.85);
      --bg-color: #0d0d12;
    }
    
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background: var(--bg-color);
      color: var(--text-color);
      display: flex;
      flex-direction: column;
      align-items: center;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      position: relative;
      padding: 20px 10px;
    }

    /* Ambient glowing orbs */
    .shape {
      position: absolute;
      border-radius: 50%;
      filter: blur(120px);
      z-index: 0;
      pointer-events: none;
    }
    .shape1 { width: 60vw; height: 60vw; background: rgba(255, 42, 95, 0.15); top: -20%; left: -10%; animation: float1 20s ease-in-out infinite alternate; }
    .shape2 { width: 50vw; height: 50vw; background: rgba(0, 122, 255, 0.15); bottom: -10%; right: -10%; animation: float2 25s ease-in-out infinite alternate; }
    .shape3 { width: 40vw; height: 40vw; background: rgba(255, 122, 0, 0.1); top: 40%; left: 30%; animation: float3 30s ease-in-out infinite alternate; }

    @keyframes float1 { 100% { transform: translateY(10vh) translateX(5vw); } }
    @keyframes float2 { 100% { transform: translateY(-10vh) translateX(-5vw); } }
    @keyframes float3 { 100% { transform: scale(1.3); } }

    header {
      position: relative;
      top: 0;
      flex-shrink: 0;
      display: flex;
      justify-content: space-between;
      width: 100%;
      max-width: 1200px;
      padding: 10px 20px;
      z-index: 10;
      align-items: center;
    }

    .logo-container {
      display: flex;
      align-items: center;
      gap: 12px;
      background: transparent;
      padding: 8px 10px;
    }
    .logo-container img { height: 28px; object-fit: contain; filter: brightness(0) invert(1); opacity: 0.9; }
    .logo-text { font-size: 1.2rem; font-weight: 800; letter-spacing: 2px; color: #fff; text-transform: uppercase; opacity: 0.9;}

    .header-controls {
      display: flex;
      gap: 12px;
      align-items: center;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    /* Glass effect */
    .glass {
      background: var(--glass-bg);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid var(--glass-border);
      box-shadow: 0 4px 24px -1px rgba(0, 0, 0, 0.2);
    }

    button {
      border-radius: 100px;
      padding: 14px 28px;
      font-size: 1.05rem;
      font-weight: 600;
      letter-spacing: 0.5px;
      color: var(--text-color);
      cursor: pointer;
      transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      background: var(--glass-bg);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid var(--glass-border);
    }
    button:hover {
      background: rgba(255, 255, 255, 0.1);
      transform: translateY(-2px);
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.3);
      border-color: rgba(255,255,255,0.15);
    }
    button:active { transform: translateY(1px); }
    button.icon-btn { padding: 0; border-radius: 50%; font-size: 1.2rem; width: 44px; height: 44px; display: inline-flex; }
    
    #soundSelectBtn { border-radius: 100px; padding: 10px 20px; font-size: 0.95rem; min-width: 110px; }

    /* Tabs */
    .tabs-container {
      display: inline-flex;
      gap: 5px;
      margin-top: 2vh;
      padding: 6px;
      border-radius: 100px;
      z-index: 10;
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.05);
    }
    .tab-btn {
      padding: 10px 30px;
      font-size: 0.95rem;
      border-radius: 100px;
      background: transparent;
      border: none;
      box-shadow: none;
      color: rgba(255,255,255,0.4);
      font-weight: 600;
      letter-spacing: 0.5px;
    }
    .tab-btn:hover { background: rgba(255,255,255,0.05); color: #fff; transform: none; }
    .tab-btn.active {
      color: #fff;
      background: rgba(255,255,255,0.1);
      box-shadow: 0 4px 15px rgba(0,0,0,0.2);
      border: 1px solid rgba(255,255,255,0.05);
    }

    .main-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      flex-grow: 1;
      width: 100%;
      max-width: 1000px;
      padding: 0 20px;
      z-index: 1;
      overflow-y: auto;
    }
    .main-container::-webkit-scrollbar { display: none; }
    .main-container { -ms-overflow-style: none; scrollbar-width: none; }

    .view-section {
      width: 100%;
      display: none;
      flex-direction: column;
      align-items: center;
      gap: min(5vh, 40px);
      animation: fadeIn 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    .view-section.active { display: flex; }

    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.98); }
      to { opacity: 1; transform: scale(1); }
    }

    /* Common Time Display Style */
    .time-display {
      font-size: min(18vw, 12vh, 7rem);
      font-weight: 300;
      font-variant-numeric: tabular-nums;
      letter-spacing: -3px;
      color: #fff;
      text-shadow: 0 4px 30px rgba(0,0,0,0.4);
      line-height: 1;
    }
    .time-display.large {
      font-size: min(22vw, 15vh, 9rem);
      font-weight: 300;
    }
    .time-display .ms { font-size: 0.4em; color: rgba(255,255,255,0.4); font-weight: 400; }

    /* TIMER VIEW */
    .timer-container {
      position: relative;
      width: min(65vw, 40vh, 500px);
      height: min(65vw, 40vh, 500px);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: conic-gradient(var(--disk-bg) 0deg, var(--primary-color) 0deg, var(--primary-color) 360deg);
      border: 1px solid rgba(255,255,255,0.02);
      box-shadow: 
        -10px -10px 30px rgba(255,255,255,0.02),
        15px 15px 40px rgba(0,0,0,0.6),
        inset 0 0 20px rgba(0,0,0,0.5);
      transition: box-shadow 0.4s;
    }
    
    /* Fine inner ticks ring */
    .timer-container::before {
      content: '';
      position: absolute;
      top: -15px; left: -15px; right: -15px; bottom: -15px;
      border-radius: 50%;
      border: 1px solid rgba(255,255,255,0.08);
      background: repeating-conic-gradient(from 0deg, rgba(255,255,255,0.2) 0deg 0.5deg, transparent 0.5deg 6deg);
      -webkit-mask: radial-gradient(transparent 68%, black 70%);
      mask: radial-gradient(transparent 68%, black 70%);
      pointer-events: none;
      opacity: 0.3;
    }

    .timer-center {
      position: absolute;
      width: 82%; height: 82%;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 
        inset 0 4px 15px rgba(255,255,255,0.05), 
        0 10px 40px rgba(0,0,0,0.8);
      cursor: pointer; user-select: none; transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1), background 0.4s;
      background: #15161c;
      border: 1px solid rgba(255,255,255,0.03);
    }
    .timer-center:hover { background: #1a1b23; transform: scale(1.03); }
    .timer-center:active { transform: scale(0.98); }
    
    .presets { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; width: 100%; max-width: 600px; margin-top: 1vh;}
    .presets button { flex: 1 1 calc(33% - 12px); min-width: 90px; padding: 16px 20px; font-size: 1rem; letter-spacing: 1px; font-weight: 500; }
    .presets button.custom-btn { background: rgba(255, 255, 255, 0.1); border-color: rgba(255, 255, 255, 0.2); color: #fff;}

    /* Auto Repeat Checkbox */
    .checkbox-wrap {
      display: inline-flex; align-items: center; gap: 10px; font-size: 0.95rem; cursor: pointer;
      background: rgba(255,255,255,0.03); padding: 12px 24px; border-radius: 100px;
      border: 1px solid rgba(255,255,255,0.05); color: rgba(255,255,255,0.7);
      transition: all 0.3s;
    }
    .checkbox-wrap:hover { background: rgba(255,255,255,0.06); color: #fff;}
    .checkbox-wrap input { width: 18px; height: 18px; cursor: pointer; accent-color: var(--primary-color); }

    /* STOPWATCH VIEW */
    .controls { display: flex; gap: 20px; margin-top: 20px; }
    .controls button { font-size: 1.1rem; padding: 18px 50px; border-radius: 100px; min-width: 140px;}
    .controls .btn-primary { background: var(--primary-color); border-color: transparent; font-weight: 600; color: #fff; }
    .controls .btn-primary:hover { filter: brightness(1.1); box-shadow: 0 10px 40px rgba(255,59,48,0.3); border-color: transparent; }

    .sw-options { display: flex; gap: 24px; background: transparent; padding: 15px 0; margin-top: -10px; }
    .sw-options label { display: flex; align-items: center; gap: 8px; cursor: pointer; font-size: 0.95rem; color: rgba(255,255,255,0.6);}
    .sw-options label:hover { color: #fff; }
    .sw-options input[type="radio"] { accent-color: var(--primary-color); transform: scale(1.2); }

    .records-container {
      width: 100%; max-width: 500px; max-height: 30vh; overflow-y: auto;
      border-radius: 24px; padding: 20px; display: flex; flex-direction: column; gap: 10px;
      background: rgba(255,255,255,0.02);
      border: 1px solid rgba(255,255,255,0.05);
    }
    .records-container::-webkit-scrollbar { width: 4px; }
    .records-container::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 4px; }
    .record-item {
      display: flex; justify-content: space-between; align-items: center;
      padding: 16px 24px; background: rgba(255,255,255,0.03); border-radius: 16px;
      border: 1px solid rgba(255,255,255,0.04); font-size: 1.1rem;
    }
    .record-item span.idx { font-weight: 500; color: rgba(255,255,255,0.5); font-size: 0.95rem;}
    .record-item span.time { font-family: 'Inter', monospace; font-size: 1.25rem; font-weight: 300; letter-spacing: 1px;}

    /* CLOCK VIEW */
    .clock-date { font-size: 1.4rem; font-weight: 400; letter-spacing: 4px; color: rgba(255,255,255,0.5); margin-bottom: -10px; text-transform: uppercase;}
    .alarm-card {
      width: 100%; max-width: 480px; border-radius: 32px; padding: 35px;
      display: flex; flex-direction: column; gap: 24px;
      background: rgba(255,255,255,0.02);
      border: 1px solid rgba(255,255,255,0.05);
    }
    .alarm-card h3 { font-size: 1.3rem; font-weight: 400; text-align: center; margin-bottom: 5px; color: rgba(255,255,255,0.8); }
    .glass-input {
      background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1);
      color: #fff; padding: 16px 20px; border-radius: 16px; font-size: 2rem; outline: none; text-align: center;
      font-weight: 300; font-family: 'Inter', sans-serif; letter-spacing: 2px;
      transition: border-color 0.3s;
    }
    .glass-input:focus { border-color: rgba(255,255,255,0.3); }
    .glass-input::-webkit-calendar-picker-indicator { filter: invert(1); cursor: pointer; opacity: 0.5; }
    .glass-input::-webkit-calendar-picker-indicator:hover { opacity: 1; }
    .alarm-row { display: flex; flex-direction: column; gap: 20px; }

    .color-themes { display: flex; gap: 12px; align-items: center; padding: 10px 16px; border-radius: 100px; }
    .theme-btn { width: 24px; height: 24px; border-radius: 50%; border: 2px solid transparent; cursor: pointer; padding: 0; transition: transform 0.3s, border-color 0.3s; }
    .theme-btn.active { transform: scale(1.3); border-color: rgba(255,255,255,0.9); box-shadow: 0 0 15px rgba(255,255,255,0.2); }

    /* Modals */
    .modal-overlay {
      position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.8);
      display: flex; align-items: center; justify-content: center; opacity: 0; pointer-events: none; transition: opacity 0.4s cubic-bezier(0.16, 1, 0.3, 1); z-index: 100; backdrop-filter: blur(20px);
    }
    .modal-overlay.show { opacity: 1; pointer-events: auto; }
    .modal {
      background: var(--modal-bg); border: 1px solid rgba(255,255,255,0.08); padding: 45px; border-radius: 40px; width: 90%; max-width: 480px;
      box-shadow: 0 30px 80px rgba(0,0,0,0.8); text-align: center;
      transform: scale(0.95); transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .modal-overlay.show .modal { transform: scale(1); }
    .modal h2 { margin-bottom: 35px; font-size: 1.6rem; color: #fff; font-weight: 400; letter-spacing: 1px;}
    .modal input[type="number"] { 
      width: 90px; font-size: 3.5rem; text-align: center; padding: 10px; 
      border: 1px solid rgba(255,255,255,0.1); border-radius: 20px; margin: 0 15px; 
      font-weight: 300; color: #fff; background: rgba(255,255,255,0.03); 
      -moz-appearance: textfield; outline:none; transition: border-color 0.3s;
    }
    .modal input[type="number"]:focus { border-color: var(--primary-color); }
    .modal input[type="number"]::-webkit-outer-spin-button,
    .modal input[type="number"]::-webkit-inner-spin-button {
      -webkit-appearance: none; margin: 0;
    }
    .modal .input-group { display: flex; align-items: center; justify-content: center; font-size: 3rem; font-weight: 300; margin-bottom: 40px; color: rgba(255,255,255,0.5); }
    .modal-actions { display: flex; gap: 15px; }
    .modal-actions button { flex: 1; padding: 18px; font-size: 1.1rem; }
    .modal-actions button.primary { background: var(--primary-color); border-color: transparent; }

    body.visual-alarm::after {
      content: ''; position: absolute; top:0; left:0; width:100%; height:100%;
      box-shadow: inset 0 0 150px var(--primary-color); animation: pulseAlarm 0.8s infinite alternate; pointer-events: none; z-index: 999;
    }
    @keyframes pulseAlarm { from { opacity: 0.1; } to { opacity: 0.6; } }

  </style>
</head>
<body>

  <div class="shape shape1"></div>
  <div class="shape shape2"></div>
  <div class="shape shape3"></div>

  <header>
    <div class="logo-container">
      <img src="/logo.png" alt="Willgrow Logo">
      <span class="logo-text">Willgrow</span>
    </div>
    <div class="header-controls">
      <div class="color-themes glass">
        <button class="theme-btn active" style="background-color: #ff3b30;" data-color="#ff3b30" aria-label="Red"></button>
        <button class="theme-btn" style="background-color: #007aff;" data-color="#007aff" aria-label="Blue"></button>
        <button class="theme-btn" style="background-color: #34c759;" data-color="#34c759" aria-label="Green"></button>
        <button class="theme-btn" style="background-color: #ffcc00;" data-color="#ffcc00" aria-label="Yellow"></button>
      </div>
      <button id="soundSelectBtn" class="glass" title="알람 소리 바꾸기">🎵 차임벨</button>
      <button id="soundToggle" class="icon-btn glass" title="음소거">🔊</button>
      <button id="fullscreenToggle" class="icon-btn glass" title="전체화면">⛶</button>
    </div>
  </header>

  <!-- Mode Tabs -->
  <div class="tabs-container glass">
    <button class="tab-btn active" data-view="timerView">타이머</button>
    <button class="tab-btn" data-view="stopwatchView">스톱워치</button>
    <button class="tab-btn" data-view="clockView">시계/알람</button>
  </div>

  <div class="main-container">
    
    <!-- 1. TIMER -->
    <div id="timerView" class="view-section active">
      <div class="timer-container" id="timerDisk">
        <div class="timer-center" id="playPauseBtn" title="시작/일시정지">
          <div class="time-display" id="timeDisplay">00:00</div>
        </div>
      </div>
      <label class="checkbox-wrap">
        <input type="checkbox" id="autoRepeatToggle"> 자동 반복 (Auto-repeat)
      </label>
      <div class="presets">
        <button class="glass" onclick="setTimer(60)">⏱️ 1분</button>
        <button class="glass" onclick="setTimer(120)">⏱️ 2분</button>
        <button class="glass" onclick="setTimer(180)">⏱️ 3분</button>
        <button class="glass" onclick="setTimer(300)">⏱️ 5분</button>
        <button class="glass custom-btn" onclick="openCustomModal()">✏️ 직접 입력</button>
      </div>
    </div>

    <!-- 2. STOPWATCH -->
    <div id="stopwatchView" class="view-section">
      <div class="time-display large" id="swDisplay">00:00<span class="ms">.00</span></div>
      
      <div class="sw-options">
        <label title="초기화되고 분할 기록 측정"><input type="radio" name="swMode" value="lap" checked> 랩 타임 (구간)</label>
        <label title="누적 기록 유지하며 측정"><input type="radio" name="swMode" value="split"> 스플릿 (누적)</label>
      </div>
      
      <div class="controls">
        <button class="btn-primary" id="swStartBtn">시작</button>
        <button class="glass" id="swLapResetBtn">초기화</button>
      </div>
      <div class="records-container glass" id="swRecords">
        <!-- Records parsed here -->
      </div>
    </div>

    <!-- 3. CLOCK / ALARM -->
    <div id="clockView" class="view-section">
      <div class="clock-date" id="clockDate">2026. 03. 26.</div>
      <div class="time-display large" id="clockTime">00:00:00</div>
      
      <div class="alarm-card glass">
        <h3>디지털 알람 설정</h3>
        <label class="checkbox-wrap" style="justify-content: center;">
          <input type="checkbox" id="hourlyChimeToggle"> 🔔 매 정각 시보 울림
        </label>
        <hr style="border-top: 1px solid rgba(255,255,255,0.2); border-bottom: none; margin: 5px 0;">
        <div class="alarm-row">
          <input type="time" id="alarmTimeInput" class="glass-input">
          <label class="checkbox-wrap" style="flex:1; justify-content: center;">
            <input type="checkbox" id="alarmToggle"> 알람 활성화
          </label>
        </div>
      </div>
    </div>

  </div>

  <!-- Custom Time Modal -->
  <div class="modal-overlay" id="customModal">
    <div class="modal">
      <h2>시간 상세 설정</h2>
      <div class="input-group">
        <input type="number" id="customMin" min="0" max="99" value="0" placeholder="00"> :
        <input type="number" id="customSec" min="0" max="59" value="0" placeholder="00">
      </div>
      <div class="modal-actions">
        <button class="glass" onclick="closeCustomModal()">취소</button>
        <button class="glass primary" onclick="applyCustomTime()">적용</button>
      </div>
    </div>
  </div>

  <script>
    // --- Audio System ---
    let audioCtx = null;
    function initAudio() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
    }
    const sounds = [
      { id: 'chime', name: '🎵 차임벨', 
        func: () => {
          if(!audioCtx) return; const t=audioCtx.currentTime, osc=audioCtx.createOscillator(), g=audioCtx.createGain();
          osc.type='sine'; osc.frequency.setValueAtTime(880,t); osc.frequency.exponentialRampToValueAtTime(440,t+1.5);
          g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(0.5,t+0.05); g.gain.exponentialRampToValueAtTime(0.01,t+1.5);
          osc.connect(g); g.connect(audioCtx.destination); osc.start(t); osc.stop(t+1.5);
        }
      },
      { id: 'marimba', name: '🎵 마림바', 
        func: () => {
          if(!audioCtx) return; const t=audioCtx.currentTime;
          [523.25, 659.25, 783.99, 987.77].forEach((f,i)=>{
            const osc=audioCtx.createOscillator(), g=audioCtx.createGain(); osc.type='sine'; osc.frequency.value=f;
            g.gain.setValueAtTime(0,t+i*0.08); g.gain.linearRampToValueAtTime(0.2,t+i*0.08+0.05); g.gain.exponentialRampToValueAtTime(0.01,t+i*0.08+1.5);
            osc.connect(g); g.connect(audioCtx.destination); osc.start(t+i*0.08); osc.stop(t+i*0.08+1.5);
          });
        }
      },
      { id: 'beep', name: '🎵 비프음', 
        func: () => {
          if(!audioCtx) return; const t=audioCtx.currentTime;
          [0,0.2,0.4].forEach(offset=>{
            const osc=audioCtx.createOscillator(), g=audioCtx.createGain(); osc.type='square'; osc.frequency.value=800;
            g.gain.setValueAtTime(0,t+offset); g.gain.linearRampToValueAtTime(0.1,t+offset+0.02); g.gain.linearRampToValueAtTime(0,t+offset+0.15);
            osc.connect(g); g.connect(audioCtx.destination); osc.start(t+offset); osc.stop(t+offset+0.15);
          });
        }
      },
      { id: 'retro', name: '⏰ 레트로 알람', 
        func: () => {
          if(!audioCtx) return; const t=audioCtx.currentTime;
          for(let i=0; i<12; i++) {
            const offset = i * 0.12;
            const osc1 = audioCtx.createOscillator(), osc2 = audioCtx.createOscillator(), g = audioCtx.createGain();
            osc1.type = 'sawtooth'; osc1.frequency.value = 850;
            osc2.type = 'square'; osc2.frequency.value = 880;
            g.gain.setValueAtTime(0, t+offset); 
            g.gain.linearRampToValueAtTime(1.0, t+offset+0.01); 
            g.gain.linearRampToValueAtTime(1.0, t+offset+0.09); 
            g.gain.linearRampToValueAtTime(0, t+offset+0.11);
            osc1.connect(g); osc2.connect(g); g.connect(audioCtx.destination);
            osc1.start(t+offset); osc2.start(t+offset);
            osc1.stop(t+offset+0.11); osc2.stop(t+offset+0.11);
          }
        }
      },
      { id: 'mega_retro', name: '🚨 아주 큰 메가 레트로', 
        func: () => {
          if(!audioCtx) return; const t=audioCtx.currentTime;
          // Very loud, piercing, fast repeating double tone like classic mechanical/electronic alarm
          for(let i=0; i<30; i++) {
            const offset = i * 0.08;
            const osc1 = audioCtx.createOscillator(), osc2 = audioCtx.createOscillator(), g = audioCtx.createGain();
            osc1.type = 'square'; osc1.frequency.value = 1000;
            osc2.type = 'square'; osc2.frequency.value = 1300;
            g.gain.setValueAtTime(0, t+offset); 
            g.gain.linearRampToValueAtTime(0.8, t+offset+0.01); 
            g.gain.linearRampToValueAtTime(0.6, t+offset+0.05); 
            g.gain.linearRampToValueAtTime(0, t+offset+0.07);
            osc1.connect(g); osc2.connect(g); g.connect(audioCtx.destination);
            osc1.start(t+offset); osc2.start(t+offset);
            osc1.stop(t+offset+0.07); osc2.stop(t+offset+0.07);
          }
        }
      }
    ];
    let currentSoundIdx=0, isSoundOn=true;
    function playAlarm() {
      if(isSoundOn) { initAudio(); sounds[currentSoundIdx].func(); }
    }
    document.getElementById('soundSelectBtn').onclick = function() {
      initAudio(); currentSoundIdx = (currentSoundIdx+1)%sounds.length;
      this.textContent = sounds[currentSoundIdx].name; playAlarm();
    };
    document.getElementById('soundToggle').onclick = function() {
      isSoundOn = !isSoundOn; this.textContent = isSoundOn ? '🔊':'🔇';
    };
    function triggerVisualAlarm() {
      document.body.classList.add('visual-alarm');
      playAlarm();
      setTimeout(()=>document.body.classList.remove('visual-alarm'), 5000);
      document.body.addEventListener('click', ()=>document.body.classList.remove('visual-alarm'), {once:true});
    }

    // --- Header & General ---
    document.getElementById('fullscreenToggle').onclick = function() {
      if(!document.fullscreenElement) { document.documentElement.requestFullscreen(); this.textContent='🗗'; }
      else { document.exitFullscreen(); this.textContent='⛶'; }
    };
    document.querySelectorAll('.theme-btn').forEach(btn => {
      btn.onclick = () => {
        document.querySelectorAll('.theme-btn').forEach(b=>b.classList.remove('active'));
        btn.classList.add('active');
        document.documentElement.style.setProperty('--primary-color', btn.getAttribute('data-color'));
      }
    });

    // --- Tab Switching ---
    document.querySelectorAll('.tab-btn').forEach(btn => {
      btn.onclick = () => {
        document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
        btn.classList.add('active');
        document.querySelectorAll('.view-section').forEach(v=>v.classList.remove('active'));
        document.getElementById(btn.getAttribute('data-view')).classList.add('active');
      }
    });

    // --- Format Utils ---
    function formatMMSS(s) {
      if(s<=0) return "00:00";
      const m=Math.floor(s/60).toString().padStart(2,'0'); const ms=Math.floor(s%60).toString().padStart(2,'0');
      return `${m}:${ms}`;
    }
    function formatMillis(msTotal) {
      const ms = Math.floor((msTotal%1000)/10).toString().padStart(2,'0');
      const s = Math.floor((msTotal/1000)%60).toString().padStart(2,'0');
      const m = Math.floor(msTotal/60000).toString().padStart(2,'0');
      return { main:`${m}:${s}`, sub:`.${ms}` };
    }

    // --- 1. TIMER LOGIC ---
    let tTotal=0, tRemaining=0, tInterval=null, tRunning=false;
    const tDisplay=document.getElementById('timeDisplay'), tDisk=document.getElementById('timerDisk'), autoRepeat=document.getElementById('autoRepeatToggle');
    function updateTimerUI() {
      tDisplay.textContent = formatMMSS(tRemaining);
      const swept = tTotal>0 ? (360 - (tRemaining/tTotal)*360) : 360;
      tDisk.style.background = tTotal>0 ? `conic-gradient(var(--disk-bg) 0deg, var(--disk-bg) ${swept}deg, var(--primary-color) ${swept}deg, var(--primary-color) 360deg)` : `conic-gradient(var(--disk-bg) 0deg, var(--disk-bg) 360deg)`;
    }
    window.setTimer = function(sec) {
      document.body.classList.remove('visual-alarm');
      tTotal=sec; tRemaining=sec; updateTimerUI();
      if(tRunning) { clearInterval(tInterval); startTimer(); } else { toggleTimer(); }
    }
    function startTimer() {
      tInterval = setInterval(()=>{
        tRemaining-=0.1;
        if(tRemaining<=0) {
          tRemaining=0; updateTimerUI();
          triggerVisualAlarm();
          if(autoRepeat.checked) { tRemaining=tTotal; } else { clearInterval(tInterval); tRunning=false; tDisk.style.opacity='0.7'; }
        }
        updateTimerUI();
      }, 100);
    }
    function toggleTimer() {
      initAudio(); document.body.classList.remove('visual-alarm');
      if(tTotal<=0) return;
      if(tRunning) { clearInterval(tInterval); tRunning=false; tDisk.style.opacity='0.7'; }
      else { if(tRemaining<=0) tRemaining=tTotal; tDisk.style.opacity='1'; startTimer(); tRunning=true; }
    }
    document.getElementById('playPauseBtn').onclick = toggleTimer;
    
    // Custom Modal
    window.openCustomModal=()=>document.getElementById('customModal').classList.add('show');
    window.closeCustomModal=()=>document.getElementById('customModal').classList.remove('show');
    window.applyCustomTime=()=>{
      const m=parseInt(document.getElementById('customMin').value)||0, s=parseInt(document.getElementById('customSec').value)||0;
      if(m*60+s > 0) { setTimer(m*60+s); closeCustomModal(); }
    };

    // --- 2. STOPWATCH LOGIC ---
    let swState='stopped', swStartTs=0, swPauseTs=0, swCumMs=0, swLapStartTs=0, reqAfId=null;
    let swRecords=[];
    const swDisplay=document.getElementById('swDisplay'), swBtn1=document.getElementById('swStartBtn'), swBtn2=document.getElementById('swLapResetBtn'), swRecList=document.getElementById('swRecords');

    function swDraw() {
      const now = Date.now();
      const mode = document.querySelector('input[name="swMode"]:checked').value;
      let displayMs = 0;
      if(swState === 'running') {
        if(mode === 'lap') displayMs = now - swLapStartTs; // Lap mode resets visually
        else displayMs = swCumMs + (now - swStartTs); // Split mode maintains total sum
      } else {
        // Paused or Stopped
        if(mode === 'lap') displayMs = swCumMs===0? 0 : (swPauseTs - swLapStartTs);
        else displayMs = swCumMs;
      }
      
      const fmt = formatMillis(displayMs);
      swDisplay.innerHTML = `${fmt.main}<span class="ms">${fmt.sub}</span>`;
      if(swState==='running') reqAfId = requestAnimationFrame(swDraw);
    }

    swBtn1.onclick = () => {
      initAudio();
      if(swState === 'stopped' || swState === 'paused') {
        swState = 'running';
        swStartTs = Date.now();
        if(swCumMs === 0) swLapStartTs = swStartTs; // first start
        else swLapStartTs += (swStartTs - swPauseTs); // shift lap start 
        swBtn1.textContent = '정지';
        swBtn1.classList.remove('btn-primary'); swBtn1.style.background='rgba(255,255,255,0.2)';
        swBtn2.textContent = '랩/스플릿';
        reqAfId = requestAnimationFrame(swDraw);
      } else {
        swState = 'paused';
        swPauseTs = Date.now();
        swCumMs += (swPauseTs - swStartTs);
        cancelAnimationFrame(reqAfId);
        swBtn1.textContent = '계속';
        swBtn1.classList.add('btn-primary'); swBtn1.style.background='';
        swBtn2.textContent = '초기화';
        swDraw();
      }
    };

    swBtn2.onclick = () => {
      const mode = document.querySelector('input[name="swMode"]:checked').value;
      if(swState === 'running') {
        const now = Date.now();
        const curTotal = swCumMs + (now - swStartTs);
        const curLap = now - swLapStartTs;
        swRecords.push({ lap: curLap, split: curTotal });
        
        // Prepare row
        const num = swRecords.length;
        const fmtLap = formatMillis(curLap); const fmtSplit = formatMillis(curTotal);
        const entry = document.createElement('div'); entry.className = 'record-item';
        entry.innerHTML = `<span class="idx">${num}구간</span> <span class="time" style="font-size:0.9rem; color:#aaa;" title="스플릿">${fmtSplit.main}${fmtSplit.sub}</span> <span class="time" title="랩 타임">${fmtLap.main}${fmtLap.sub}</span>`;
        swRecList.prepend(entry);

        swLapStartTs = now; // always reset lap start time
      } else if (swState === 'paused' || swState === 'stopped') {
        // Reset full
        swState = 'stopped';
        swStartTs=0; swPauseTs=0; swCumMs=0; swLapStartTs=0;
        swRecords = []; swRecList.innerHTML = '';
        swBtn1.textContent = '시작';
        swBtn1.classList.add('btn-primary'); swBtn1.style.background='';
        swBtn2.textContent = '초기화';
        swDraw();
      }
    };
    
    // Changing modes should redraw immediately
    document.querySelectorAll('input[name="swMode"]').forEach(r => r.onchange = swDraw);

    // --- 3. CLOCK / ALARM LOGIC ---
    const clockTime = document.getElementById('clockTime'), clockDate = document.getElementById('clockDate');
    const hourlyChimeCheckbox = document.getElementById('hourlyChimeToggle');
    const alarmTimeInput = document.getElementById('alarmTimeInput'), alarmToggle = document.getElementById('alarmToggle');
    let lastHandledHour = -1;
    let alarmHasRung = false;

    setInterval(()=>{
      const d = new Date();
      // Clock Update
      clockDate.textContent = `${d.getFullYear()}. ${(d.getMonth()+1).toString().padStart(2,'0')}. ${d.getDate().toString().padStart(2,'0')}.`;
      clockTime.textContent = d.toTimeString().split(' ')[0];

      const h = d.getHours(), m = d.getMinutes(), s = d.getSeconds();

      // Hourly Chime
      if(hourlyChimeCheckbox.checked && m === 0 && s === 0 && h !== lastHandledHour) {
        lastHandledHour = h;
        initAudio(); sounds.find(x=>x.id==='beep').func();
      }

      // Alarm feature
      if(alarmToggle.checked && alarmTimeInput.value) {
        const [ah, am] = alarmTimeInput.value.split(':').map(Number);
        if(h === ah && m === am && s === 0 && !alarmHasRung) {
          alarmHasRung = true;
          triggerVisualAlarm();
        }
      }
      
      if(alarmToggle.checked && alarmTimeInput.value) {
         const [ah, am] = alarmTimeInput.value.split(':').map(Number);
         // Reset lock if it's no longer the exact minute
         if (m !== am) alarmHasRung = false;
      }
    }, 1000);

    // Init display
    updateTimerUI();
    swDraw();

  </script>
</body>
</html>
